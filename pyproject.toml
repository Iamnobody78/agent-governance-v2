[project]
name = "governance-gateway"
version = "0.1.0"
description = "Non-invasive Sidecar/Proxy for Agent governance — honest reimplementation from v1.7.0-PoC"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
