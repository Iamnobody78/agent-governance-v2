# GATE 1-8 CI — agent-governance-v2
#
# Contract (tests/test_ci_workflow.py, DEBT-0003 / TASK-REAL-012):
#   the workflow MUST define an `all-gates` job whose `needs` lists exactly
#   these 7 gate jobs: test-quality, policy-audit, gateway-smoke,
#   policy-probe, meta-security, policy-sync, critic-gate.
# Branch protection then requires a single check name ("all-gates").
name: gates-1-8

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # GATE 1 (syntax) + GATE 3 (full regression >= 450) + test-quality gates
  test-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps (core + test + real SDKs)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout
          pip install "cryptography>=42.0"
          pip install langchain langchain-openai autogen-agentchat autogen-ext[openai] aiohttp
      - name: "GATE 1 — syntax/import (compileall)"
        run: python -m compileall -q src tests examples scripts
      - name: "GATE 3 — full regression (baseline >= 450)"
        run: |
          python -m pytest tests -q --timeout=120 > pytest.log 2>&1 || true
          tail -5 pytest.log
          PASSED=$(grep -oP '\d+(?= passed)' pytest.log | head -1)
          echo "passed=$PASSED"
          test -n "$PASSED" && test "$PASSED" -ge 450 || { echo "GATE 3 FAIL: passed=$PASSED < 450"; exit 1; }
      - name: Test quality gates (no fake asserts, test count)
        run: python scripts/check_test_quality.py

  # GATE 2a (no hardcoded policy) + GATE 5 (certification self-check)
  policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "cryptography>=42.0"
      - name: "GATE 2a — no hardcoded policy in source"
        run: python scripts/check_policy.py
      - name: "GATE 5 — certification self-check (ED25519 sign/verify)"
        run: |
          SIG=$(python -m src.certification.sign --file CONTRIBUTING.md 2>/dev/null | tail -1)
          test -n "$SIG" || { echo "GATE 5 FAIL: empty signature"; exit 1; }
          python -m src.certification.verify --file CONTRIBUTING.md --signature "$SIG"

  # GATE 6 — live gateway E2E: B1 (LangChain) + B2 (AutoGen) + 3 examples
  gateway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps (incl. real SDKs)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout
          pip install langchain langchain-openai autogen-agentchat autogen-ext[openai] aiohttp
      - name: "GATE 6a — B1 e2e (LangChain agent via live gateway)"
        run: python scripts/b1_e2e.py
      - name: "GATE 6b — B2 e2e (AutoGen group chat via live gateway)"
        run: python scripts/b2_e2e.py
      - name: "GATE 6c — examples E2E (stub + gateway + 3 agents)"
        run: |
          python examples/_stub_llm.py > /tmp/stub.log 2>&1 &
          STUB_PID=$!
          python -m src.main > /tmp/gw.log 2>&1 &
          GW_PID=$!
          trap 'kill $STUB_PID $GW_PID 2>/dev/null || true' EXIT
          sleep 3
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/v1/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          test "$code" = "200" || { echo "GATE 6c FAIL: gateway not ready:"; tail -20 /tmp/gw.log; exit 1; }
          python examples/external_agent_demo.py > /tmp/ex.log 2>&1 || { tail -20 /tmp/ex.log; exit 1; }
          python examples/langchain_agent.py > /tmp/lc.log 2>&1 || { tail -20 /tmp/lc.log; exit 1; }
          python examples/autogen_agent.py > /tmp/ac.log 2>&1 || { tail -20 /tmp/ac.log; exit 1; }
          grep -q "DENY" /tmp/lc.log && grep -q "ESCALATE" /tmp/lc.log || { echo "langchain evidence missing"; tail -20 /tmp/lc.log; exit 1; }
          grep -q "DENY" /tmp/ac.log && grep -q "trace_id" /tmp/ac.log || { echo "autogen evidence missing"; tail -20 /tmp/ac.log; exit 1; }
          echo "GATE 6c PASS: all examples governed + evidence verified"

  # GATE 2b — policy consistency probe
  policy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "GATE 2b — policy consistency probe"
        run: python examples/policy_probe.py

  # GATE 4a — meta-security anti-pattern AST scan (AUDIT-0005 lessons)
  meta-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "GATE 4a — anti-pattern scan (fail-open / bypass)"
        run: python scripts/meta_security_scanner.py

  # GATE 2c — YAML vs runtime heuristic drift detection (AUDIT-0004 lesson)
  policy-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "GATE 2c — policy YAML drift detection"
        run: python scripts/policy_sync.py

  # GATE 8 — critic team (5 critics, majority pass) + governance artifacts
  critic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: "GATE 7 — governance artifacts consistent"
        run: |
          test -f .aionui/audit_log.md || { echo "GATE 7 FAIL: audit_log.md missing"; exit 1; }
          test -f .aionui/context/TRIPLE_LOOP_SNAPSHOT.md || { echo "GATE 7 FAIL: snapshot missing"; exit 1; }
          grep -q "^> 版本: v1.25.0" .aionui/context/TRIPLE_LOOP_SNAPSHOT.md || { echo "GATE 7 FAIL: snapshot version != v1.25.0"; exit 1; }
          grep -q "AUDIT-0046" .aionui/audit_log.md || { echo "GATE 7 FAIL: AUDIT-0046 missing"; exit 1; }
          echo "GATE 7 PASS: artifacts consistent"
      - name: "GATE 8 — critic team (5 critics, majority pass)"
        run: python -m src.critic.runner

  # Contract aggregation job (DEBT-0003): single check name for branch protection
  all-gates:
    needs: [test-quality, policy-audit, gateway-smoke, policy-probe, meta-security, policy-sync, critic-gate]
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: echo "GATE 1-8 PASS"
