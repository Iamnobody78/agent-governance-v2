name: governance-gateway CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Gate 1 + 2: Test quality (no dataclass asserts, no test inflation) ──
  test-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run test quality scanner
        run: python scripts/check_test_quality.py

  # ── Gate 3: Policy must be YAML, not hardcoded ──
  policy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Run policy audit
        run: python scripts/check_policy.py

  # ── Gate 4: Smoke tests must pass ──
  gateway-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Run gateway tests
        run: python -m pytest tests/ -v --tb=short
      - name: Check coverage threshold
        run: |
          pip install pytest-cov
          python -m pytest tests/ --cov=src --cov-report=term --cov-fail-under=60

  # ── Gate 5: Policy consistency (YAML rules vs _is_dangerous) ──
  policy-probe:
    name: GATE 5 - Policy Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # NOTE: must install full deps — policy_probe imports from src.main
      # which imports aiohttp/pydantic. pyyaml alone → ModuleNotFoundError.
      - name: Install dependencies
        run: pip install -e ".[test]"
      - name: Run policy_probe
        run: python examples/policy_probe.py

  # GATE 6: Security anti-pattern scanner (breaker-tripping-to-ALLOW,
  # timeout-default-ALLOW, silent-swallow, startswith-without-normpath)
  meta-security:
    name: GATE 6 - Security Anti-pattern Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run meta-security scanner on src/
        run: python scripts/meta_security_scanner.py src

  # GATE 7: Policy-code drift detector (AUDIT-0004 lesson: lowercase
  # 'deny' passed CI while runtime else-branch silently ALLOWed)
  policy-sync:
    name: GATE 7 - Policy/Code Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run policy-sync drift check
        run: python scripts/policy_sync.py
