## 路由仲裁规则（外环）

1. 任务 ≤2 文件、≤5 维度 → 单 Builder + Reviewer 接力（调度层第一阶段）
2. 任务 >2 文件 → 拆分多任务，每任务独立接力（防撞车：文件分配表）
3. 安全敏感变更 → Reviewer 必须运行真实验证（pytest/AST），禁止口头 PASS
4. 子代理不可互相通信 → 接力永远由 Coordinator 驱动，共享上下文=工作区文件系统
5. 关键产物"先落盘"：verdict 类文件必须在子代理最早可行阶段写入（TASK-SCHED-001 教训）

## 沙箱隔离（声明式）

```yaml
# 提议中的沙箱规则（YAML 声明式，待批准）
Builder:
  write: ["src/", "config/", "tests/"]
  deny: [".aionui/decisions/", ".aionui/scheduler/"]
Reviewer:
  write: ["*.verdict.md", ".aionui/scheduler/work/**"]
  deny: ["src/", "tests/", "config/"]
```
