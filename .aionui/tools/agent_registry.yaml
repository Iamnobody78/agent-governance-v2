# Agent 注册表 — agent-governance 团队制（外环协议）

> 维护者: Coordinator（Meta Harness Proposer / 治理智能体）
> 更新: 2026-08-03（调度层第一阶段）
> 用途: 记录每个 Agent 实例的能力边界、状态、当前会话；路由仲裁依据。

## 本地 Spawn 角色（哑执行者，单次任务生命周期）

| 角色 | 能力边界 | 允许写入 | 只读 | 状态 |
|------|----------|----------|------|------|
| **Builder** 🛠️ | 生成/修改源代码 ≤2 文件/任务 | `src/`, `config/`, `tests/` | — | 可用（TASK-SCHED-001 验证） |
| **Tester** 🧪 | 编写并运行测试 | `tests/` | `src/` | 可用（同 Builder 通道） |
| **Reviewer** 🔍 | 审查产物、运行验证、输出 PASS/REJECT | 仅 `work/<TASK>/reviewer_verdict.md` | `src/`, `tests/`, `work/` | 可用（v2 先落盘协议验证） |
| **Archivist** 📁 | 更新文档/审计日志 | `*.md`, `.aionui/` | — | 备用（2 代理模式由 Reviewer 兼任） |

